
[project]
name = "ai-research-and-analysis-team"
version = "0.1.0"
description = "AI-powered research and analysis multi-agent system"
readme = "README.md"
authors = [
    { name = "babu2004", email = "132599446+babu2004@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "crewai[litellm]>=1.15.41",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "numpy>=2.5.5",
    "openai>=2.30,<3",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ai-research-and-analysis-team = "ai_research_and_analysis_team:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
